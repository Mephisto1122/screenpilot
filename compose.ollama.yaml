# Optional: run Ollama inside Docker instead of natively on the host.
# On a Mac this is CPU-only (no Apple GPU) and much slower than native Ollama.
#   docker compose -f compose.yaml -f compose.ollama.yaml up --build
# With NVIDIA (Linux / WSL2, NVIDIA Container Toolkit installed):
#   docker compose -f compose.yaml -f compose.ollama.yaml -f compose.nvidia.yaml up --build
services:
  screenpilot:
    environment:
      OLLAMA_URL: "http://ollama:11434"
    depends_on:
      ollama:
        condition: service_started
  ollama:
    image: "${OLLAMA_IMAGE:-ollama/ollama:latest}"
    volumes:
      - screenpilot-ollama:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "15m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    restart: unless-stopped
volumes:
  screenpilot-ollama:
